
name: KruxMon Releases

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish (e.g. v0.1.0); leave blank for a development build"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build Linux x86_64 artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Package source ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix=kruxmon/ \
            HEAD \
            -o dist/kruxmon-source.zip

      - name: Create AppImage directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/scalable/apps \
            dist

          install -Dm755 \
            target/release/kruxmon \
            AppDir/usr/bin/kruxmon

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kruxmon" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/kruxmon.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=KruxMon
          Comment=Lightweight Linux system monitor
          Exec=kruxmon
          Icon=kruxmon
          Terminal=true
          Categories=System;Monitor;
          EOF

          cp AppDir/kruxmon.desktop \
            AppDir/usr/share/applications/kruxmon.desktop

          cat > AppDir/usr/share/icons/hicolor/scalable/apps/kruxmon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="128" height="128" viewBox="0 0 128 128">
            <rect x="4" y="4" width="120" height="120" rx="18"
                  fill="#080a08" stroke="#dbb95c" stroke-width="4"/>
            <path d="M20 68h18l10-24 18 44 13-31 9 11h20"
                  fill="none" stroke="#96be7d" stroke-width="6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

          cp AppDir/usr/share/icons/hicolor/scalable/apps/kruxmon.svg \
            AppDir/kruxmon.svg

      - name: Download AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool AppDir dist/KruxMon-x86_64.AppImage
          chmod +x dist/KruxMon-x86_64.AppImage

      - name: Publish continuous prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: KruxMon development build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            dist/kruxmon-source.zip
            dist/KruxMon-x86_64.AppImage

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KruxMon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/kruxmon-source.zip
            dist/KruxMon-x86_64.AppImage
